<!doctype html><html lang="ja"><meta charset="utf-8"><style>body{font:14px sans-serif;color:#222}label{display:block;margin:8px 0}input,select{padding:6px;margin-left:8px}button{padding:8px 14px;margin:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.row{border-bottom:1px solid #ddd;padding:8px;cursor:pointer}.msg{color:#a21}</style><body><h2>開催設定</h2><div id="list">読み込み中…</div><hr><form id="form"><input type="hidden" id="id"><input type="hidden" id="version"><label>開催名称 <input id="name" required maxlength="80"></label><div class="grid"><label>開始日 <input id="startDate" type="date" required></label><label>終了日 <input id="endDate" type="date" required></label><label>確認受付期限 <input id="receptionEndDate" type="date" required></label><label>達成目標 <input id="target" type="number" min="1" max="30" value="7" required></label></div><label>出目別スタンプ（1〜6） <span id="points"></span></label><label><input id="confirmationEnabled" type="checkbox" checked> スタッフ確認を有効</label><button type="submit">確認して保存</button><button type="button" onclick="clearForm()">新規</button><button type="button" onclick="duplicateSelected()">この開催を複製</button><button type="button" onclick="pauseSelected(true)">一時停止</button><button type="button" onclick="pauseSelected(false)">再開</button><p class="msg" id="msg" role="status"></p></form><script>
const $=id=>document.getElementById(id);let selected=null,pendingOperationId='',pendingFingerprint='';for(let i=1;i<=6;i++)$('points').insertAdjacentHTML('beforeend',`<label style="display:inline">${i}<input class="point" type="number" min="1" max="30" value="${i===6?3:i>=4?2:1}" style="width:48px"></label>`);
function load(){google.script.run.withSuccessHandler(rows=>{$('list').replaceChildren(...rows.map(c=>{const d=document.createElement('div');d.className='row';d.textContent=`${c.id}｜${c.name}｜${c.startDate}〜${c.endDate}｜${c.paused?'停止':'稼働'}`;d.onclick=()=>select(c);return d;}));}).withFailureHandler(err=>msg(err.message)).adminListCampaigns();}function select(c){selected=c;$('id').value=c.id;$('version').value=c.version;$('name').value=c.name;$('startDate').value=c.startDate;$('endDate').value=c.endDate;$('receptionEndDate').value=c.receptionEndDate;$('target').value=c.target;$('confirmationEnabled').checked=c.confirmationEnabled;document.querySelectorAll('.point').forEach((x,i)=>x.value=c.points[i]);}function clearForm(){selected=null;$('form').reset();$('id').value='';$('version').value='';$('target').value=7;}function msg(s){$('msg').textContent=s;}function payload(){const p={id:$('id').value||null,version:Number($('version').value)||0,name:$('name').value,startDate:$('startDate').value,endDate:$('endDate').value,receptionEndDate:$('receptionEndDate').value,target:Number($('target').value),points:[...document.querySelectorAll('.point')].map(x=>Number(x.value)),confirmationEnabled:$('confirmationEnabled').checked};const fingerprint=JSON.stringify(p);if(!pendingOperationId||fingerprint!==pendingFingerprint){pendingOperationId=crypto.randomUUID();pendingFingerprint=fingerprint;}p.operationId=pendingOperationId;return p;}
$('form').onsubmit=e=>{e.preventDefault();const p=payload();if(!confirm(`${p.name}\n${p.startDate}〜${p.endDate}\n確認期限 ${p.receptionEndDate}\n目標 ${p.target}／配点 ${p.points.join(', ')}\nこの内容を保存しますか？`))return;google.script.run.withSuccessHandler(()=>{pendingOperationId='';pendingFingerprint='';msg('保存しました');load();}).withFailureHandler(err=>msg(err.message)).adminSaveCampaign(p);};function duplicateSelected(){if(!selected)return msg('複製元を選択してください');google.script.run.withSuccessHandler(r=>{select(r.campaign);msg('複製用の入力欄を作成しました。日付を入力して保存してください');}).withFailureHandler(err=>msg(err.message)).adminDuplicateCampaign(selected.id,crypto.randomUUID());}function pauseSelected(v){if(!selected)return msg('開催を選択してください');if(!confirm(v?'抽選を一時停止しますか？確認受付は独立しています。':'開催期間内で抽選を再開しますか？'))return;google.script.run.withSuccessHandler(()=>{msg('更新しました');load();}).withFailureHandler(err=>msg(err.message)).adminSetPaused(selected.id,v,crypto.randomUUID());}load();
</script></body></html>
