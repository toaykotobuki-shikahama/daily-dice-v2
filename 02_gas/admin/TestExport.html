<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{font:15px/1.7 system-ui;padding:20px;color:#16304c}button{display:block;margin:10px 0;padding:10px;width:100%;cursor:pointer}</style></head><body><p>日本語対応のUTF-8（BOM付き）CSVです。ボタンでPCへ保存してください。</p><div id="files"></div><p>ChatGPTへ共有する前に、実施者名・操作アカウント・証拠URLを共有してよいか店舗内で確認してください。</p><script>const files=<?!= payload ?>;files.forEach(f=>{const b=document.createElement('button');b.textContent=f.name;b.onclick=()=>{const blob=new Blob([f.text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};document.getElementById('files').append(b);});</script></body></html>
