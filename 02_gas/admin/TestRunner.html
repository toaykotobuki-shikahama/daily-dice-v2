display:block;font-family:monospace;font-size:18px;letter-spacing:.08em;overflow-wrap:anywhere;margin:12px 0;color:#ffe5a4}.message{font-size:12px;text-align:center;line-height:1.8;color:#f6d69c;white-space:pre-line}footer{text-align:center;margin-top:30px;font-size:10px}.celebration{position:fixed;inset:0;z-index:20;background:radial-gradient(#324567,#081426 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.celebration .scene{opacity:0;transform:scale(.25);transition:opacity .4s,transform .8s}.celebration.merge .scene{opacity:1;transform:scale(1.35)}.gold .face{background:linear-gradient(135deg,#fff4c8,#e9b946 55%,#8c6017);border-color:#f8dfa1;box-shadow:inset 0 0 16px #fff7,0 0 18px #eac77345}.gold .pip{background:#624619}.celebration.merge .cube{animation:goldspin 4s linear infinite}.celebration h2{font-size:clamp(22px,6vw,32px);color:#ffe5a3;letter-spacing:.08em;margin-top:60px;text-shadow:0 0 20px #e8b850;opacity:0}.celebration p,.celebration button{opacity:0}.celebration.reveal h2,.celebration.reveal p,.celebration.reveal button{animation:reveal .7s ease forwards}.celebration button{max-width:290px;margin-top:24px}.orbit{position:absolute;inset:0;pointer-events:none}.flying-stamp{position:absolute;width:40px;height:40px;left:calc(50% - 20px);top:calc(50% - 20px);transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .5s}.orbit.gather .flying-stamp{transform:translate(0,0) scale(.2)!important;opacity:0}.bridge-frame{position:fixed;width:1px;height:1px;left:-100px;top:-100px;border:0}select{width:100%;padding:10px;color:var(--text);background:#14283f;border:1px solid #34506b;border-radius:8px}#campaignPicker{font-size:12px;margin-top:20px}#demoBanner{text-align:center;background:#634324;color:#fff1bd;padding:8px;border-radius:8px;font-size:12px}[hidden]{display:none!important}@keyframes press{0%{transform:scale(1.8) rotate(-20deg);opacity:0}65%{transform:scale(.9)}100%{transform:scale(1);opacity:1}}@keyframes glow{to{box-shadow:0 0 22px #ffdc7a;filter:brightness(1.3)}}@keyframes goldspin{to{transform:rotateX(342deg) rotateY(695deg)}}@keyframes reveal{to{opacity:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-width:360px){main{padding-left:15px;padding-right:15px}.stamp{width:34px;height:34px}.stamps{gap:6px}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cmain>\u003cheader>\u003cp class=\"eyebrow\">DAILY DICE CHALLENGE\u003c/p>\u003ch1>デイリー\u003cbr>サイコロチャレンジ\u003c/h1>\u003cp>スタッフ検証用\u003cbr>本番カードへの記録はありません\u003c/p>\u003c/header>\n\u003cp id=\"demoBanner\" hidden>演出プレビュー・記録されません\u003c/p>\u003cp id=\"welcome\" class=\"subtle\" hidden>前回はご参加ありがとうございました！\u003c/p>\n\u003cdiv id=\"campaignPicker\" hidden>\u003clabel>参加カード\u003cselect id=\"campaignSelect\">\u003c/select>\u003c/label>\u003c/div>\n\u003csection class=\"stage\" aria-label=\"サイコロ\">\u003cdiv class=\"halo\">\u003c/div>\u003cdiv class=\"scene\">\u003cdiv id=\"dice\" class=\"cube\">\u003c/div>\u003c/div>\u003cdiv class=\"shadow\">\u003c/div>\u003c/section>\n\u003cp id=\"result\" class=\"result\" role=\"status\" aria-live=\"polite\">参加状況を確認しています…\u003c/p>\u003cbutton id=\"roll\" class=\"primary\" disabled>サイコロを振る\u003c/button>\u003cbutton id=\"retry\" class=\"secondary\" hidden>参加状況を再取得\u003c/button>\n\u003csection class=\"card\">\u003cdiv class=\"card-title\">\u003ch2>STAMP CARD\u003c/h2>\u003cstrong id=\"total\">0 / 7\u003c/strong>\u003c/div>\u003cdiv id=\"stamps\" class=\"stamps\">\u003c/div>\u003cp id=\"remaining\">7スタンプ貯まると何かが起こる…？\u003c/p>\u003c/section>\n\u003csection id=\"achieved\" class=\"notice\" hidden>\u003ch2>MISSION COMPLETE!\u003c/h2>\u003cp>スタッフへお声がけください\u003c/p>\u003cp id=\"reception\">\u003c/p>\u003cspan class=\"subtle\">確認コード\u003c/span>\u003cstrong id=\"code\" class=\"code\">\u003c/strong>\u003cp id=\"expires\" class=\"subtle\">\u003c/p>\u003cp id=\"reference\" class=\"subtle\">\u003c/p>\u003cbutton id=\"refresh\" class=\"secondary\">確認状況を更新\u003c/button>\u003cbutton id=\"demoComplete\" class=\"secondary\" hidden>確認完了の表示を試す（プレビュー）\u003c/button>\u003c/section>\n\u003csection id=\"completed\" class=\"notice\" hidden>\u003ch2>ご参加ありがとうございました\u003c/h2>\u003cp>チャレンジへのご参加ありがとうございました\u003c/p>\u003c/section>\n\u003cp id=\"message\" role=\"status\" class=\"message\">\u003c/p>\u003cfooter>検証カードは何度でも挑戦できます\u003cbr>進捗・結果は検証専用DBへ保存します\u003c/footer>\n\u003c/main>\u003cdiv id=\"celebration\" class=\"celebration\" hidden>\u003cdiv id=\"orbit\" class=\"orbit\">\u003c/div>\u003cdiv class=\"scene\">\u003cdiv id=\"goldDice\" class=\"cube gold\">\u003c/div>\u003c/div>\u003ch2>MISSION COMPLETE!\u003c/h2>\u003cp>スタッフへお声がけください\u003c/p>\u003cbutton id=\"closeCelebration\" class=\"primary\">達成カードを表示\u003c/button>\u003c/div>\n\u003cscript>window.DICE_CONFIG={gasUrl:'STAFF_TRANSPORT',storageKey:'dice.staff.card.v2.'+parent.diceTestSessionId(),pollMs:45000};\nwindow.DiceTransport=class {request(r){return parent.diceTestGameRequest(r);}reset(){}};\nwindow.DICE_TEST_HOOKS=parent.DICE_TRIAL_HOOKS;\nwindow.diceHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,'0')).join('');\n\u003c/script>\u003cscript>'use strict';\n(() => {\n const $=id=>document.getElementById(id), cfg=DICE_CONFIG, preview=new URLSearchParams(location.search).get('preview')==='1';\n const source=['line','pop'].includes(new URLSearchParams(location.search).get('source'))?new URLSearchParams(location.search).get('source'):'other';\n const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n function testEvent(name,data){window.DICE_TEST_HOOKS?.[name]?.(data);}\n const wait=ms=>new Promise(r=>setTimeout(r,reduced?Math.min(ms,30):ms));\n let transport,state,identity={},busy=false,poll,midnight,chosenCampaign=null,spin,previewCount=0,spinning=false,finishSpinWait=null;\n const patterns={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};\n function makeCube(node){Object.entries(patterns).forEach(([n,positions])=>{const face=document.createElement('div');face.className='face '+['','one','two','three','four','five','six'][n];face.setAttribute('aria-hidden','true');positions.forEach(p=>{const dot=document.createElement('i');dot.className='pip';dot.style.gridColumn=String((p-1)%3+1);dot.style.gridRow=String(Math.floor((p-1)/3)+1);face.append(dot);});node.append(face);});}\n makeCube($('dice'));makeCube($('goldDice'));\n function readIdentity(){const raw=localStorage.getItem(cfg.storageKey);if(raw){const obj=JSON.parse(raw);if(!/^[a-f0-9]{64}$/.test(obj.registrationKey||''))throw Error('STORAGE_FORMAT');return obj;}const obj={registrationKey:diceHex(32)};localStorage.setItem(cfg.storageKey,JSON.stringify(obj));if(localStorage.getItem(cfg.storageKey)!==JSON.stringify(obj))throw Error('STORAGE');return obj;}\n function writeIdentity(patch){identity={...identity,...patch};localStorage.setItem(cfg.storageKey,JSON.stringify(identity));}\n function auth(){return {participantId:identity.participantId,secret:identity.secret,source,...(chosenCampaign?{campaignId:chosenCampaign}:{})};}\n async function api(action,extra={}){if(preview)return demo(action);\n const response=await transport.request({action,...auth(),...extra});if(!response?.ok)throw Error(response?.error||'TRANSPORT_ERROR');return response;}\n function demo(action){const campaign={id:'PREVIEW',name:'デイリーサイコロチャレンジ',target:7,active:true,receptionOpen:true};if(!state)state={ok:true,campaign,card:{state:'ACTIVE',total:0,actualTotal:0,canRoll:true}};\n if(action==='roll'){const face=[1,4,6,1][previewCount++%4],earned=face===6?3:face>=4?2:1,total=state.card.actualTotal+earned;state={...state,card:{state:total>=7?'ACHIEVED':'ACTIVE',total:Math.min(7,total),actualTotal:total,canRoll:total\u003c7,lastResult:{eventId:'DEMO-'+previewCount,face,earned},confirmationCode:'PREVIEW / 確認処理不可'}};}return JSON.parse(JSON.stringify(state));}\n function message(text){$('message').textContent=text;}\n function fail(e){const text={AUTH:'保存済みカードの認証を確認できません。通信が回復しても続く場合はスタッフへご相談ください。',RATE_LIMIT:'少し時間をおいて参加状況を再取得してください。',CONFIG:'公開準備中です。接続先が設定されていません。',STORAGE:'このブラウザに参加記録を保存できません。通常のブラウザで同じURLを開いてください。',STORAGE_FORMAT:'保存済みの参加情報を読み取れません。スタッフへご相談ください。',CAMPAIGN_CONFIGURATION:'キャンペーン設定を確認中です。',SETUP_REQUIRED:'公開準備中です。'}[e.message]||'通信を確認できませんでした。参加状況を再取得してください。抽選済みの場合は記録を復元します。';message(text);$('retry').hidden=false;$('roll').disabled=true;}\n function buildStamps(target,total){$('stamps').replaceChildren();for(let i=1;i\u003c=target;i++){const node=document.createElement('div');node.className='stamp'+(i\u003c=total?' filled':'');node.textContent=i\u003c=total?'✦':String(i);node.setAttribute('aria-label',i+'個目 '+(i\u003c=total?'獲得済み':'未獲得'));$('stamps').append(node);}}\n function render(r){state=r;clearTimeout(poll);clearTimeout(midnight);const c=r.campaign,card=r.card;$('welcome').hidden=!r.previous;const total=card?.total||0;buildStamps(c.target,total);$('total').textContent=total+' / '+c.target;$('remaining').textContent=card?.state==='ACTIVE'||!card?'あと'+(c.target-total)+'個で達成':'達成済み';$('roll').hidden=!!card&&card.state!=='ACTIVE';$('roll').disabled=busy||!card?.canRoll;$('achieved').hidden=card?.state!=='ACHIEVED';$('completed').hidden=card?.state!=='COMPLETED';$('retry').hidden=true;\n if(!c.active&&(!card||card.state==='ACTIVE'))$('result').textContent=c.status==='準備中'?'次回開催の準備中です':'現在のチャレンジ受付は終了しています';\n else if(card?.state==='COMPLETED')$('result').textContent='確認が完了しました';\n else if(card?.state==='ACHIEVED')$('result').textContent='MISSION COMPLETE!';\n else if(card?.todayPlayed&&!card.canRoll)$('result').textContent='本日はチャレンジ済み';\n else $('result').textContent='今日のサイコロを振ってみよう';\n if(card?.todayPlayed&&!card.canRoll&&card.state==='ACTIVE'){message('次回は '+new Date(card.nextAvailableAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+'（日本時間）から');const delay=new Date(card.nextAvailableAt)-new Date(r.serverTime)+1500;if(false&&delay>0&&delay\u003c86410000)midnight=setTimeout(()=>refresh(),delay);}\n if(card?.state==='ACHIEVED'){$('reference').textContent='カード末尾 '+(card.reference||'DEMO0001');$('demoComplete').hidden=!preview;$('code').textContent=preview?'プレビュー用（確認処理不可）':card.confirmationCode?card.confirmationCode.match(/.{1,5}/g).join('-'):'';$('expires').textContent=card.confirmationExpiresAt?'コードの有効期限 '+new Date(card.confirmationExpiresAt).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'})+'（日本時間）':'';$('reception').textContent=c.receptionOpen?'この画面をスタッフへお見せください':'現在、スタッフ確認の受付は停止しています';if(false&&!preview&&!document.hidden)poll=setTimeout(()=>refresh(true),Math.max(30000,cfg.pollMs));}\n const all=r.campaignCards||[];if(all.length>1){$('campaignPicker').hidden=false;$('campaignSelect').replaceChildren();all.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.id+' '+x.name+(x.state==='ACHIEVED'?'（確認待ち）':x.state==='COMPLETED'?'（完了）':'');o.selected=x.id===c.id;$('campaignSelect').append(o);});}else $('campaignPicker').hidden=true;\n }\n async function refresh(quiet=false){if(busy)return;busy=true;$('roll').disabled=true;try{const r=identity.participantId||preview?await api('status',identity.pendingRoll?.campaignId?{campaignId:identity.pendingRoll.campaignId}:{}):await api('register',{registrationKey:identity.registrationKey});if(r.identity)writeIdentity(r.identity);const pending=identity.pendingRoll;busy=false;message('');render(r);testEvent('refreshDisplay',{face:r.card?.lastResult?.face,total:r.card?.total,state:r.card?.state});\n if(pending&&r.card?.lastResult&&r.card.lastResult.eventId!==pending.previousEvent){writeIdentity({pendingRoll:null});await animateResult(r,pending.previousTotal||0);}\n else if(pending){writeIdentity({pendingRoll:null});message('参加状況を確認しました。参加可能な場合はボタンを押してください。');}\n }catch(e){busy=false;if(!quiet)fail(e);else{message('確認状況の更新を待っています。手動でも再取得できます。');/* automatic retry disabled in staff tests */}}}\n function setSpinControl(active){spinning=active;$('dice').setAttribute('role','button');$('dice').setAttribute('tabindex',active?'0':'-1');$('dice').setAttribute('aria-disabled',String(!active));$('dice').setAttribute('aria-label',active?'サイコロを止める':'サイコロ');$('dice').style.cursor=active?'pointer':'default';}\n function spinWait(){return new Promise(resolve=>{let timer;const finish=()=>{clearTimeout(timer);if(finishSpinWait===finish)finishSpinWait=null;resolve();};finishSpinWait=finish;timer=setTimeout(finish,reduced?10:850);});}\n function requestSpinStop(){if(!spinning)return;testEvent('tap',{});finishSpinWait?.();$('result').textContent='結果を確認しています…';}\n $('dice').onclick=requestSpinStop;\n $('dice').addEventListener('keydown',event=>{if(spinning&&(event.key==='Enter'||event.key===' ')){event.preventDefault();requestSpinStop();}});\n setSpinControl(false);\n function startSpin(){testEvent('spinStart',{});setSpinControl(true);$('result').textContent='回転中… サイコロをタップで止める';const dir=Math.random()>.5?1:-1;spin=$('dice').animate([{transform:'rotateX(-18deg) rotateY(-25deg)'},{transform:`rotateX(${dir*702}deg) rotateY(${dir*1055}deg)`}],{duration:reduced?10:2000,iterations:Infinity,easing:'linear'});}\n async function stopSpin(face){setSpinControl(false);spin?.cancel();const targets={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};const [x,y]=targets[face];const animation=$('dice').animate([{transform:'rotateX(310deg) rotateY(410deg)'},{transform:`rotateX(${360+x}deg) rotateY(${360+y}deg)`}],{duration:reduced?10:300,easing:'cubic-bezier(.15,.7,.2,1)',fill:'forwards'});await animation.finished;$('dice').style.transform=`rotateX(${x}deg) rotateY(${y}deg)`;animation.cancel();$('dice').setAttribute('aria-label','出目 '+face);testEvent('spinEnd',{face});}\n async function animateResult(r,before){const card=r.card,last=card.lastResult;if(!last)return;await stopSpin(last.face);render(r);$('result').textContent=last.face+'の目！ ＋'+last.earned+'スタンプ';testEvent('resultDisplay',{face:last.face,total:card.total,state:card.state});for(let i=before;i <script>
'use strict';const $=id=>document.getElementById(id),KEY='dice.staff.trials.v2';let current=null,active=null,queue=Promise.resolve(),busy=0,lastResponseAt=0,localPause=false,failures=0,clock=null,pending=false,selected='',autoStart=false;
let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){saved={};}
lastResponseAt=Number(saved.lastResponseAt)||0;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){note('一時保存できません。サーバー保存分は実施一覧から再開できます。');}}
function note(s){$('notice').textContent=s;}
function requestId(){return 'REQ-'+crypto.randomUUID();}
function device(){const ua=navigator.userAgent||'',os=/Windows/.test(ua)?'Windows':/Android/.test(ua)?'Android':/iPhone|iPad/.test(ua)?'iOS':/Macintosh/.test(ua)?'Mac':'その他',browser=/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'その他';return os+'/'+browser+'/'+screen.width+'x'+screen.height;}
function item(){return current?.plan.find(x=>x.id===selected)||current?.plan[0];}
function controls(){const enabled=current?.state.phase==='実施中'&&!localPause&&!finishing;$('trialStart').disabled=busy>0||!enabled||!!current?.state.active;$('resume').disabled=busy>0||!current||!!current?.state.active;$('pause').disabled=!current||localPause;$('items').disabled=!!current?.state.active;$('feedback').disabled=busy>0||!current||!$('feedbackTrial').value;$('start').disabled=busy>0;$('open').disabled=busy>0||!$('runs').children.length;$('game').style.pointerEvents=enabled&&!!active?'auto':'none';}
function render(){if(!current){controls();return;}$('entry').hidden=true;$('work').hidden=false;$('title').textContent='Ver.'+current.ver+' 試行検証';$('identity').textContent=current.id+' ／ '+current.appVersion+' ／ '+current.name;$('phase').textContent=['完了','回数達成・要確認'].includes(current.state.phase)?current.state.phase:localPause?'中断・通信確認待ち':current.state.phase;const c=current.counts,total=current.plan.reduce((n,p)=>n+p.target,0);$('counts').textContent='実施 '+c.total+' / '+total+'　成功 '+c.success+'　失敗 '+c.failure+'　中断 '+c.interrupted+'　未確認 '+c.unknown;$('progress').value=Math.min(100,c.total/total*100);
 $('items').replaceChildren();for(const p of current.plan){const o=document.createElement('option');o.value=p.id;o.textContent=p.title+'　'+p.counts.total+'/'+p.target;o.selected=p.id===selected;$('items').append(o);}if(!selected)selected=current.plan[0].id;const p=item();$('itemCounts').textContent='この項目：'+p.counts.total+' / '+p.target+'　残り '+Math.max(0,p.target-p.counts.total)+'　達成率 '+Math.min(100,Math.round(p.counts.total/p.target*100))+'%';$('condition').textContent=p.condition;$('steps').textContent=p.steps;$('expected').textContent=p.expected;$('measure').textContent='計測：'+p.start+' → '+p.end;$('definition').textContent='条件版 '+p.definition;
 $('recent').replaceChildren();$('feedbackTrial').replaceChildren();for(const r of [...current.recent].reverse()){const tr=document.createElement('tr');for(const txt of [r.id.slice(-8),r.result,r.opMs===''?'未取得':r.opMs+'ms']){const td=document.createElement('td');td.textContent=txt;tr.append(td);}$('recent').append(tr);const o=document.createElement('option');o.value=r.id;o.textContent=r.id.slice(-8)+' '+r.result;$('feedbackTrial').append(o);}controls();}
function raw(r){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('TIMEOUT：通信結果が不明です')),30000);google.script.run.withSuccessHandler(out=>{clearTimeout(timer);resolve(out);}).withFailureHandler(e=>{clearTimeout(timer);reject(e);}).staffTrialRpc(r);});}
function send(action,extra={}){const job=async()=>{busy++;controls();const r={action,sessionId:current?.id,requestId:requestId(),expectedRev:current?.state.rev,...extra};saved.pending=r;persist();const delay=Math.max(0,3200-(Date.now()-lastResponseAt));if(delay)await new Promise(resolve=>setTimeout(resolve,delay));const began=performance.now();pending=true;
 try{const out=await raw(r),rtt=performance.now()-began;current=out.session;saved.sessionId=current.id;saved.pending=null;persist();failures=0;render();return {...out,rtt,queueWait:delay};}catch(e){saved.lastError=String(e.message||e).slice(0,2000);persist();failures++;if(failures>=3)localPause=true;note(e.message||String(e));throw e;}finally{lastResponseAt=Date.now();saved.lastResponseAt=lastResponseAt;persist();pending=false;busy--;controls();}};const work=queue.then(job,job);queue=work.catch(()=>{});return work;}
function loadGame(){if(!current)return;$('game').srcdoc=TEST_GAME_HTML;}
function beginClock(event){if(clock)return;clock={start:performance.now(),origin:performance.timeOrigin,at:new Date().toISOString(),event,taps:0,tapTimes:[],animationMs:0,achievementMs:0,achievementStart:0,spin:0,timings:[],queueWait:0};saved.localStart={trialId:active['試行ID'],nonce:active['認可値'],event,at:clock.at};persist();}
window.diceTestSessionId=()=>current.id;
window.DICE_TRIAL_HOOKS={operationStart(){if(active&&!localPause)beginClock('dice-start');},spinStart(){if(clock)clock.spin=performance.now();},spinEnd(){if(clock&&clock.spin){clock.animationMs+=performance.now()-clock.spin;clock.spin=0;}},achievementStart(){if(clock)clock.achievementStart=performance.now();},achievementEnd(){if(clock&&clock.achievementStart){clock.achievementMs+=performance.now()-clock.achievementStart;clock.achievementStart=0;}},tap(){if(clock){clock.taps++;clock.tapTimes.push(performance.now()-clock.start);}},resultDisplay(d){if(!active||localPause)return;clock.display=d;if(item().kind==='save')return;else if(item().kind!=='achieve'&&item().kind!=='leave')finish(d);},operationEnd(){if(active&&!localPause&&item().kind==='save')$('game').contentDocument.getElementById('refresh').click();},refreshDisplay(d){if(!active||localPause)return;if(item().kind==='reload'||item().kind==='save'&&clock?.display){if(clock)finish(d);}else if(item().kind==='achieve'&&d.state==='COMPLETED'){finish(d);}else if(autoStart){autoStart=false;const button=$('game').contentDocument?.getElementById('roll');if(button&&!button.disabled)button.click();else note('ゲームを操作できません。状態を再取得してください。');}}};
window.diceTestGameRequest=async r=>{if(r.action!=='roll'){let out;if(active&&clock&&['reload','achieve','save'].includes(item().kind)){const op='OP-'+crypto.randomUUID();out=await send('execute',{trialId:active['試行ID'],nonce:active['認可値'],operation:'read',operationId:op});active=out.trial;clock.timings.push({id:op,rtt:out.rtt});clock.queueWait+=out.queueWait;}else out=await send('status');return {...out.game,identity:{participantId:'TEST-'+current.id,secret:'STAFF_ONLY'}};}if(!active||localPause)throw Error('試行を開始してください');const op='OP-'+r.requestId;const out=await send('execute',{trialId:active['試行ID'],nonce:active['認可値'],operation:'roll',operationId:op});active=out.trial;clock?.timings.push({id:op,rtt:out.rtt});if(clock)clock.queueWait+=out.queueWait;if(item().kind==='duplicate'){const replay=await send('execute',{trialId:active['試行ID'],nonce:active['認可値'],operation:'roll',operationId:op});if(clock){clock.timings.find(x=>x.id===op).rtt+=replay.rtt;clock.queueWait+=replay.queueWait;}}if(!out.operationOk){await finish({});throw Error(out.error);}return out.game;};
let finishing=false;
async function finish(display){if(finishing||!active||!clock||localPause)return;finishing=true;controls();const data={trialId:active['試行ID'],nonce:active['認可値'],display,taps:clock.taps,tapTimings:clock.tapTimes,operationMs:performance.now()-clock.start,animationMs:clock.animationMs+clock.achievementMs||undefined,achievementMs:clock.achievementMs||undefined,timings:clock.timings,queueWaitMs:clock.queueWait,clockOrigin:clock.origin};try{const out=await send('finish',data);active=null;clock=null;saved.localStart=null;saved.lastError='';persist();note('試行を自動記録しました：'+out.trial['結果']);const next=current.plan.find(p=>p.counts.total<p.target);if(next&&item().counts.total>=item().target)selected=next.id;render();}catch(e){localPause=true;note('結果表示後の保存が未確認です。状態を再取得してください。');}finally{finishing=false;controls();}}
$('trialStart').onclick=async()=>{if(!current||localPause)return;try{clock=null;const out=await send('arm',{itemId:selected,device:device(),network:$('network').value});active=out.trial;const kind=item().kind;if(['probe','invalid'].includes(kind)){beginClock('operation-start');const op='OP-'+crypto.randomUUID(),check=await send('execute',{trialId:active['試行ID'],nonce:active['認可値'],operation:'check',operationId:op,invalidValue:''});active=check.trial;clock.timings.push({id:op,rtt:check.rtt});clock.queueWait+=check.queueWait;$('operationResult').textContent=kind==='invalid'?'空欄の入力を拒否しました':'通信の結果を表示しました';await finish({});}else if(kind==='reload'){beginClock('reload-start');const op='OP-'+crypto.randomUUID(),check=await send('execute',{trialId:active['試行ID'],nonce:active['認可値'],operation:'check',operationId:op});active=check.trial;clock.timings.push({id:op,rtt:check.rtt});clock.queueWait+=check.queueWait;loadGame();}else{autoStart=true;loadGame();}}catch(e){note(e.message);}};
async function interrupt(action='pause'){localPause=true;autoStart=false;controls();$('game').srcdoc='';saveDraft();try{await send(action,{localStart:saved.localStart,clientError:saved.lastError||'',pending,trialId:active?.['試行ID']});active=null;clock=null;saved.localStart=null;saved.lastError='';persist();render();}catch(e){note('中断要求の保存は未確認です。操作は停止しました。復旧時に照合します。');}}
$('pause').onclick=()=>interrupt();$('reload').onclick=()=>active?interrupt('recover'):loadGame();
$('recover').onclick=async()=>{try{if(!current&&saved.sessionId)current={id:saved.sessionId,state:{rev:0}};if(!current){note('実施一覧から選んでください');return;}await send('recover',{localStart:saved.localStart,clientError:saved.lastError||'',pending:true});active=null;clock=null;saved.localStart=null;saved.lastError='';persist();localPause=true;render();note('前の未完了試行を未確認として保存しました。再開すると次の試行から進めます。');}catch(e){note(e.message);}};
$('resume').onclick=async()=>{try{await send('resume');localPause=false;failures=0;active=null;clock=null;loadGame();render();}catch(e){note(e.message);}};
$('complete').onclick=async()=>{if(!active||item().kind!=='achieve')return;try{const op='OP-'+crypto.randomUUID(),out=await send('execute',{trialId:active['試行ID'],nonce:active['認可値'],operation:'complete',operationId:op,code:$('code').value.trim(),staffName:$('staff').value});active=out.trial;clock.timings.push({id:op,rtt:out.rtt});clock.queueWait+=out.queueWait;if(!out.operationOk){await finish({});note(out.error);return;}$('game').contentDocument.getElementById('refresh').click();}catch(e){note(e.message);}};
$('items').onchange=()=>{selected=$('items').value;render();};
function saveDraft(){saved.notes=$('notes').value;saved.result=$('result').value;saved.feel=$('feel').value;saved.problem=$('problem').value;saved.evidence=$('evidence').value;persist();}
for(const id of ['notes','result','feel','problem','evidence'])$(id).addEventListener('input',saveDraft);

$('start').onclick=async()=>{if(!$('name').value.trim()){note('実施者名を入力してください');return;}try{localPause=false;await send('start',{name:$('name').value,ver:$('ver').value});selected=current.plan[0].id;$('staff').value=current.name;loadGame();render();}catch(e){note(e.message);}};
async function open(id){if(!id)return;current={id,state:{rev:0}};saved.sessionId=id;persist();try{await send('recover',{localStart:saved.localStart,clientError:saved.lastError||'',pending:true});selected=(current.plan.find(p=>p.counts.total<p.target)||current.plan[0]).id;active=null;clock=null;localPause=true;render();note('保存済みの続きです。再開を押してください。');}catch(e){note(e.message);}}
$('open').onclick=()=>open($('runs').value);$('back').onclick=async()=>{await interrupt();current=null;saved.sessionId=null;persist();$('work').hidden=true;$('entry').hidden=false;boot();};
window.addEventListener('beforeunload',()=>{saveDraft();saved.leftAt=new Date().toISOString();persist();});
function boot(){google.script.run.withSuccessHandler(async r=>{$('account').textContent='認証済み '+r.email+' ／ '+r.appVersion;$('ver').replaceChildren();$('runs').replaceChildren();for(const v of r.versions){const o=document.createElement('option');o.value=v;o.textContent='Ver.'+v;$('ver').append(o);}for(const run of r.runs){const o=document.createElement('option');o.value=run.id;o.textContent=run.ver+' '+run.name+' '+run.phase+' '+run.id.slice(-8);$('runs').append(o);}for(const id of ['notes','result','feel','problem','evidence'])if(saved[id])$(id).value=saved[id];const pendingStart=saved.pending?.action==='start'?'TEST-'+saved.pending.requestId.slice(4):'';if(pendingStart&&r.runs.some(x=>x.id===pendingStart)){await open(pendingStart);}else if(saved.sessionId&&r.runs.some(x=>x.id===saved.sessionId))await open(saved.sessionId);else if(saved.pending?.action==='start'){note('前の開始要求が未確認です。実施一覧にあれば選んでください。');}controls();}).withFailureHandler(e=>{note(e.message);$('start').disabled=true;}).staffTestBootstrap();}boot();
</script></body></html>
