<!doctype html><html lang="ja"><meta charset="utf-8"><style>body{font:16px sans-serif}button{padding:9px;margin:4px}.banner{padding:10px;background:#fff0bb}#events{min-height:100px}</style><body><h2>簡易動作確認</h2><p class="banner">検証中の専用カードです。お客様用データには記録されません。</p><button onclick="start()">テスト開始／新規カード</button><h3 id="sum">合計 0 / 7</h3><button id="roll" onclick="roll()" disabled>振る</button><button id="complete" onclick="complete()" disabled>テスト確認完了</button><button id="reset" onclick="reset()" disabled>このテストカードをリセット</button><ol id="events"></ol><p id="msg" role="status"></p><script>let s=null;const $=id=>document.getElementById(id);function show(t){$('msg').textContent=t}function start(){google.script.run.withSuccessHandler(r=>{s=r;$('events').replaceChildren();render();}).withFailureHandler(e=>show(e.message)).simpleTestStart()}function render(){if(!s)return;$('sum').textContent=`合計 ${s.total} / ${s.target}`;$('roll').disabled=s.state!=='ACTIVE';$('complete').disabled=s.state!=='ACHIEVED';$('reset').disabled=false;}function roll(){google.script.run.withSuccessHandler(r=>{s.total=r.total;s.state=r.state;const li=document.createElement('li');li.textContent=`${r.face}の目 ＋${r.earned}（合計 ${r.total}）`; $('events').append(li);render();}).withFailureHandler(e=>show(e.message)).simpleTestRoll(s.sessionId,s.generation)}function complete(){const name=prompt('担当者名');if(name===null)return;google.script.run.withSuccessHandler(()=>{s.state='COMPLETED';render();show('テスト確認完了');}).withFailureHandler(e=>show(e.message)).simpleTestComplete(s.sessionId,s.generation,name)}function reset(){google.script.run.withSuccessHandler(r=>{s=r;$('events').replaceChildren();render();show('テストカードをリセットしました');}).withFailureHandler(e=>show(e.message)).simpleTestReset(s.sessionId,s.generation)}</script></body></html>
