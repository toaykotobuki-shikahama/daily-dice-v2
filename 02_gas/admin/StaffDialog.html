<!doctype html><html lang="ja"><meta charset="utf-8"><style>body{font:15px sans-serif}label{display:block;margin:12px 0}input{padding:8px}.msg{color:#a21}</style><body><h2>スタッフ確認</h2><p>達成カードの確認コードを入力してください。</p><label>確認コード <input id="code" inputmode="numeric" maxlength="7" placeholder="123-456"></label><button onclick="lookup()">照合</button><div id="result" hidden><p id="card"></p><label>担当者名 <input id="staff" maxlength="40"></label><button onclick="complete()">確認完了</button></div><p class="msg" id="msg" role="status"></p><script>const $=id=>document.getElementById(id);let rec=null;function lookup(){google.script.run.withSuccessHandler(r=>{rec=r;$('result').hidden=!!r.completed;$('card').textContent=r.completed?'このカードは確認済みです':`${r.campaignName}｜カード末尾 ${r.reference}`;$('msg').textContent=r.completed?'確認済み':'';}).withFailureHandler(e=>$('msg').textContent=e.message).staffLookup($('code').value.replace(/\D/g,''));}function complete(){if(!rec||!confirm('担当者名と確認結果を記録しますか？'))return;google.script.run.withSuccessHandler(()=>{$('msg').textContent='確認完了を記録しました';$('result').hidden=true;}).withFailureHandler(e=>$('msg').textContent=e.message).staffComplete(rec.operationId,rec.campaignId,rec.participantId,$('code').value.replace(/\D/g,''),$('staff').value);}</script></body></html>
